<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Reposol - Free Online NIST OSCAL Viewer &amp; Editor</title>
    <meta name="description" content="Open-source web-based NIST OSCAL Viewer and Editor for editing, validating, and managing OSCAL Catalogs, Profiles, SSPs, Component Definitions, Assessment Plans, and POA&amp;Ms." />
    <meta name="keywords" content="OSCAL, NIST OSCAL, OSCAL Viewer, OSCAL Editor, OSCAL Model, OSCAL Catalog, OSCAL Profile, System Security Plan, SSP, POAM, Security Assessment, Cybersecurity Compliance" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://security-management-oscal.fly.dev/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://security-management-oscal.fly.dev/" />
    <meta property="og:title" content="Reposol - NIST OSCAL Viewer &amp; Editor" />
    <meta property="og:description" content="Visual web application to view, edit, validate, and manage NIST OSCAL documents across all lifecycle stages." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://security-management-oscal.fly.dev/" />
    <meta property="twitter:title" content="Reposol - NIST OSCAL Viewer &amp; Editor" />
    <meta property="twitter:description" content="Visual web application to view, edit, validate, and manage NIST OSCAL documents across all lifecycle stages." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('reposol-theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
